name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retalsystem.web/package-lock.json

      - name: Restore
        run: dotnet restore RetalSystemAPI.slnx

      - name: Build
        run: dotnet build RetalSystemAPI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test RetalSystemAPI.slnx --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Desktop UX checks
        run: dotnet run --project tests/RetalSystemAPI.Desktop.UxChecks/RetalSystemAPI.Desktop.UxChecks.csproj --configuration Release --no-build

      - name: Audit NuGet packages
        run: dotnet list RetalSystemAPI.slnx package --vulnerable --include-transitive

      - name: Install web dependencies
        working-directory: retalsystem.web
        run: npm ci

      - name: Lint web
        working-directory: retalsystem.web
        run: npm run lint

      - name: Test web
        working-directory: retalsystem.web
        run: npm test

      - name: Build web
        working-directory: retalsystem.web
        run: npm run build

      - name: Audit web packages
        working-directory: retalsystem.web
        run: npm audit --audit-level=high
